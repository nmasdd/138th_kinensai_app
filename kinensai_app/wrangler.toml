name = "kinensai-app"
compatibility_date = "2026-09-10"
main = "./worker/src/index.ts"

# Expo Web の静的ビルド (npx expo export --platform web) の出力
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# 全世界配信 (共有コンテンツ) のKV
[[kv_namespaces]]
binding = "CONTENT"
id = "56b863becb354e94b05affe288ce9ffb"

# カスタムドメイン https://app.kinensai.jp/
[[routes]]
pattern = "app.kinensai.jp"
custom_domain = true
